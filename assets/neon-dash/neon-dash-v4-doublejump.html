<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DASH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', Arial, sans-serif; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #hud {
    position:fixed; top:0; left:0; width:100%; padding:14px 22px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; color:#fff; text-shadow:0 0 10px rgba(255,255,255,.8);
    z-index:5;
  }
  .hudBox { font-size:15px; letter-spacing:2px; opacity:.9; }
  #levelName { font-size:22px; font-weight:bold; letter-spacing:4px; }
  #diffTag { font-size:12px; letter-spacing:3px; margin-top:2px; }
  #progressWrap {
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    width:40%; height:10px; border:1px solid rgba(255,255,255,.4);
    border-radius:6px; overflow:hidden; z-index:5;
    background:rgba(0,0,0,.35);
  }
  #progressBar { height:100%; width:0%; background:linear-gradient(90deg,#0ff,#f0f); box-shadow:0 0 12px #0ff; transition:width .1s linear; }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center; z-index:10;
    background:radial-gradient(circle at center, rgba(10,10,30,.82), rgba(0,0,5,.95));
    color:#fff; text-align:center; padding:20px;
  }
  #overlay h1 {
    font-size:56px; letter-spacing:12px; font-weight:900;
    background:linear-gradient(90deg,#00f0ff,#ff00e0,#ffe600);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,240,255,.6));
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  #overlay p { margin-top:18px; font-size:18px; letter-spacing:2px; opacity:.85; max-width:560px; line-height:1.6; }
  #overlay .key {
    display:inline-block; border:1px solid #fff; border-radius:6px;
    padding:2px 12px; margin:0 4px; box-shadow:0 0 10px rgba(255,255,255,.4);
  }
  #overlay button {
    margin-top:34px; padding:14px 52px; font-size:20px; letter-spacing:4px;
    background:transparent; color:#0ff; border:2px solid #0ff; border-radius:10px;
    cursor:pointer; text-transform:uppercase; font-weight:bold;
    box-shadow:0 0 18px rgba(0,255,255,.5), inset 0 0 18px rgba(0,255,255,.15);
    transition:all .2s;
  }
  #overlay button:hover { background:#0ff; color:#001; transform:scale(1.07); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hudBox"><div id="levelName">LEVEL 1</div><div id="levelSub"></div><div id="diffTag"></div></div>
  <div class="hudBox" style="text-align:right">ATTEMPTS: <span id="attempts">1</span></div>
</div>
<div id="progressWrap"><div id="progressBar"></div></div>
<div id="overlay">
  <h1>NEON DASH</h1>
  <p id="overlayMsg">Press <span class="key">SPACE</span> / <span class="key">&#8593;</span> / <span class="key">W</span> or <b>CLICK</b> to jump.<br>
  <b style="color:#ffe600">Press again in mid-air to DOUBLE JUMP!</b> \u26A1<br>
  Land on <b style="color:#0ff">squares</b>. Avoid <b style="color:#f33">spikes</b>.<br>
  Reach the <b style="color:#f0f">portal</b> to warp to the next dimension.<br>
  <span style="opacity:.7;font-size:14px">Level 1 is a chill warm-up \u2014 it gets spicier each dimension!</span></p>
  <button id="startBtn">START</button>
</div>
<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- ROBUST SIZING ----------
let W = 0, H = 0;
function syncSize(){
  const rect = canvas.getBoundingClientRect();
  const w = Math.round(rect.width  || canvas.clientWidth  || innerWidth  || document.documentElement.clientWidth  || 0);
  const h = Math.round(rect.height || canvas.clientHeight || innerHeight || document.documentElement.clientHeight || 0);
  if(w > 0 && h > 0 && (w !== W || h !== H)){ W = canvas.width = w; H = canvas.height = h; }
}
function sized(){ return W > 50 && H > 50; }
syncSize();
addEventListener('resize', syncSize);
if(typeof ResizeObserver !== 'undefined') new ResizeObserver(syncSize).observe(document.documentElement);

// ---------- CONSTANTS ----------
const U = 46;
const GROUND_FRAC = 0.78;
const BASE_SPEED = 6.0;
const GRAVITY = 0.72;
const JUMP_V = -13.4;
const DJUMP_V = -12.2;        // double jump is slightly weaker
const PLAYER = U * 0.82;

// ---------- LEVEL HELPERS ----------
function spike(x, y=0){ return {t:'spike', x, y, w:1, h:1}; }
function spikes(x, n, y=0){ const a=[]; for(let i=0;i<n;i++) a.push(spike(x+i,y)); return a; }
function block(x, y=0, w=1, h=1){ return {t:'block', x, y, w, h}; }
function stairs(x, steps){ const a=[]; for(let i=0;i<steps;i++) a.push(block(x+i, i, 1, i+1)); return a; }
function pillar(x, h){ return block(x, 0, 1, h); }
function floatPad(x, y, w=2){ return block(x, y, w, 1); }

// ---------- LEVELS (easy -> hard, double-jump aware) ----------
const LEVELS = [
  {
    name:'STEREO GENESIS', hue:200, sub:'the awakening', diff:'EASY', speed:1.0,
    data:[
      spike(16),
      spike(30),
      spike(44),
      spike(56), spike(64),
      block(74,0,3,1),
      spike(86),
      spike(96), spike(103),
      block(112,0,2,1),
      spike(122),
    ],
    len:134
  },
  {
    name:'AZURE DRIFT', hue:250, sub:'finding the rhythm', diff:'NORMAL', speed:1.05,
    data:[
      spike(14),
      ...spikes(26,2),
      spike(38),
      pillar(48,1), spike(52),
      ...spikes(62,3),             // triple: single jump clears it, double makes it easy
      block(72,0,3,1), spike(78),
      pillar(88,2),
      spike(96), ...spikes(104,2),
      block(114,0,2,1), block(116,0,2,1),
      ...spikes(126,2),
    ],
    len:138
  },
  {
    name:'VIOLET VOLTAGE', hue:280, sub:'the surge', diff:'TRICKY', speed:1.1,
    data:[
      ...spikes(14,2),
      pillar(24,2), spike(28),
      ...spikes(36,4),                               // wide pit: double jump shines here
      floatPad(46,3,3), spike(47,0), spike(48,0),    // higher pad, reach with double jump
      ...spikes(58,2), block(64,0,2,2),
      ...stairs(72,3), ...spikes(77,2),
      floatPad(86,3,2), spike(87,0),
      pillar(94,3), spike(97),
      ...spikes(104,4), floatPad(105,3,3),
      block(116,0,2,1), spike(119,0),
      ...spikes(126,2),
    ],
    len:140
  },
  {
    name:'CRIMSON CIRCUIT', hue:0, sub:'the gauntlet', diff:'HARD', speed:1.15,
    data:[
      ...spikes(12,2), pillar(18,2), spike(22),
      ...spikes(30,4), floatPad(31,3,3),
      pillar(42,2), pillar(45,4), spike(43,0), spike(44,0),    // taller tower: needs double jump
      ...spikes(54,3), floatPad(57,3,2), spike(58,0),
      floatPad(64,3,2), floatPad(69,6,2), spike(65,0), spike(66,0), spike(70,0), spike(71,0),
      block(78,0,3,1), spike(79,1), spike(80,1),
      ...spikes(88,4), floatPad(89,3,2), floatPad(94,5,2),
      ...spikes(101,2), pillar(105,4), spike(106,0), pillar(109,4),
      ...stairs(116,4), ...spikes(121,3),
      floatPad(128,4,3), spike(129,0), spike(130,0),
      ...spikes(139,2),
    ],
    len:150
  },
  {
    name:'EMERALD SINGULARITY', hue:140, sub:'the final dimension', diff:'INSANE', speed:1.22,
    data:[
      ...spikes(10,2), ...spikes(18,4), floatPad(19,3,3),
      pillar(28,2), spike(29,0), pillar(31,4), spike(32,0), pillar(34,5),   // tall tower chain
      floatPad(40,4,2), floatPad(45,7,2), spike(41,0), spike(42,0), spike(46,0), spike(47,0),
      floatPad(50,4,2), ...spikes(55,4),
      ...stairs(61,5), spike(67,5), ...spikes(68,5),           // long carpet: double jump needed
      floatPad(74,2,2), floatPad(78,5,2), floatPad(82,7,2), floatPad(87,4,2),
      spike(75,0), spike(79,0), spike(83,0), spike(84,0), spike(88,0),
      ...spikes(94,4), block(99,0,2,2), spike(100,3),
      pillar(107,2), pillar(110,5), pillar(114,2), spike(108,0), spike(109,0), spike(112,0), spike(113,0),
      ...spikes(120,5), floatPad(121,3,2), floatPad(125,5,2),
      ...stairs(132,4), ...spikes(137,3), spike(141,0),
      floatPad(146,4,3), spike(147,0), spike(148,0), spike(149,0),
      ...spikes(156,4), floatPad(157,3,3),
      ...spikes(167,2),
    ],
    len:178
  },
];

// ---------- STATE ----------
let state = 'menu';
let levelIdx = 0, attempts = 1;
let camX = 0, player = null, particles = [], rings = [], trail = [], shake = 0, flash = 0;
let bgHue = LEVELS[0].hue, bgHueTarget = LEVELS[0].hue;
let portalSpin = 0, tick = 0, deadTimer = 0, warpTimer = 0;
let stars = [];
for(let i=0;i<120;i++) stars.push({x:Math.random(), y:Math.random()*0.8, s:Math.random()*2+0.5, p:Math.random()*Math.PI*2});

function groundY(){ return H * GROUND_FRAC; }
function speedNow(){ return BASE_SPEED * LEVELS[levelIdx].speed; }

const DIFF_COLORS = {EASY:'#4f4', NORMAL:'#4cf', TRICKY:'#fc4', HARD:'#f84', INSANE:'#f44'};

function resetPlayer(){
  player = { x: 0, y: groundY() - PLAYER, vy: 0, rot: 0, onGround: true, airJumps: 1 };
  camX = -U*6; trail = [];
}
function startLevel(i){
  levelIdx = i;
  bgHueTarget = LEVELS[i].hue;
  document.getElementById('levelName').textContent = 'LEVEL ' + (i+1) + ' \u2014 ' + LEVELS[i].name;
  document.getElementById('levelSub').textContent = LEVELS[i].sub.toUpperCase();
  const dt_ = document.getElementById('diffTag');
  dt_.textContent = '\u25C6 ' + LEVELS[i].diff;
  dt_.style.color = DIFF_COLORS[LEVELS[i].diff] || '#fff';
  resetPlayer();
  state = 'play';
}

// ---------- INPUT ----------
// jumpHeld  -> holding = auto-jump whenever grounded
// jumpQueued -> set only on a FRESH press; consumed by the double jump
let jumpHeld = false, jumpQueued = false;
function pressJump(){ if(!jumpHeld) jumpQueued = true; jumpHeld = true; }
function releaseJump(){ jumpHeld = false; }
addEventListener('keydown', e => {
  if(['Space','ArrowUp','KeyW'].includes(e.code)){
    e.preventDefault();
    if(!e.repeat) pressJump(); else jumpHeld = true;
  }
});
addEventListener('keyup', e => { if(['Space','ArrowUp','KeyW'].includes(e.code)) releaseJump(); });
addEventListener('mousedown', pressJump);
addEventListener('mouseup', releaseJump);
addEventListener('touchstart', pressJump, {passive:true});
addEventListener('touchend', releaseJump);

const overlay = document.getElementById('overlay');
document.getElementById('startBtn').addEventListener('click', () => { hideOverlay(); startLevel(0); });
function hideOverlay(){ overlay.classList.add('hidden'); }
function showOverlay(title, msg, btn){
  overlay.querySelector('h1').textContent = title;
  document.getElementById('overlayMsg').innerHTML = msg;
  document.getElementById('startBtn').textContent = btn;
  overlay.classList.remove('hidden');
}

// ---------- COLLISION ----------
function getObstacles(){ return LEVELS[levelIdx].data; }
function levelEndX(){ return LEVELS[levelIdx].len * U; }
function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function die(){
  state = 'dead'; deadTimer = 0; shake = 18; flash = 0.9;
  attempts++; document.getElementById('attempts').textContent = attempts;
  const cx = player.x + PLAYER/2, cy = player.y + PLAYER/2;
  for(let i=0;i<70;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*9+2;
    particles.push({x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2, life:1, hue: bgHue + Math.random()*80, size:Math.random()*7+3});
  }
}

function completeLevel(){
  state = 'levelcomplete'; warpTimer = 0; flash = 1;
  const cx = player.x + PLAYER/2, cy = player.y + PLAYER/2;
  for(let i=0;i<90;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*11+3;
    particles.push({x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1.4, hue: (bgHue+180)%360 + Math.random()*60, size:Math.random()*8+3});
  }
}

function doubleJumpFX(){
  const cx = player.x + PLAYER/2, cy = player.y + PLAYER;
  rings.push({x:cx, y:cy, r:6, life:1});
  for(let i=0;i<16;i++){
    const a = Math.PI*(0.1 + 0.8*Math.random());   // downward fan
    const sp = Math.random()*5+2;
    particles.push({x:cx, y:cy, vx:Math.cos(a)*sp*(Math.random()<.5?-1:1), vy:Math.sin(a)*sp, life:0.7, hue:(bgHue+160)%360, size:Math.random()*5+2});
  }
}

// ---------- UPDATE ----------
function update(dt){
  tick += dt; portalSpin += 0.06*dt;
  bgHue += (bgHueTarget - bgHue) * 0.03 * dt;
  if(shake>0) shake = Math.max(0, shake - 1.1*dt);
  if(flash>0) flash = Math.max(0, flash - 0.03*dt);

  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.25*dt; p.life -= 0.02*dt;
  }
  particles = particles.filter(p=>p.life>0);
  for(const r of rings){ r.r += 3.2*dt; r.life -= 0.05*dt; }
  rings = rings.filter(r=>r.life>0);

  if(state === 'dead'){
    deadTimer += dt;
    if(deadTimer > 55){ resetPlayer(); state='play'; }
    return;
  }
  if(state === 'levelcomplete'){
    warpTimer += dt;
    if(warpTimer > 75){
      if(levelIdx + 1 < LEVELS.length){ startLevel(levelIdx+1); }
      else {
        state = 'win';
        showOverlay('YOU WIN!', 'You conquered all <b>' + LEVELS.length + ' dimensions</b> in <b>' + attempts + '</b> attempts.<br>Legend status: <b style="color:#ffe600">ACHIEVED</b> \u2726', 'PLAY AGAIN');
        document.getElementById('startBtn').onclick = () => { attempts=1; document.getElementById('attempts').textContent=1; hideOverlay(); startLevel(0); };
      }
    }
    return;
  }
  if(state !== 'play'){ jumpQueued = false; return; }

  player.x += speedNow() * dt;
  camX = player.x - W*0.3;

  player.vy += GRAVITY * dt;

  // --- JUMP LOGIC (with double jump) ---
  if(player.onGround){
    if(jumpHeld){                      // hold = auto-jump from ground
      player.vy = JUMP_V; player.onGround = false;
      jumpQueued = false;              // this press was used for the ground jump
    }
  } else if(jumpQueued && player.airJumps > 0){
    player.vy = DJUMP_V;               // fresh mid-air press = double jump
    player.airJumps--;
    jumpQueued = false;
    doubleJumpFX();
  }
  jumpQueued = false;                  // queue only lives for one frame

  const prevBottom = player.y + PLAYER;
  player.y += player.vy * dt;

  if(!player.onGround) player.rot += 0.11*dt;
  else player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);

  player.onGround = false;
  if(player.y + PLAYER >= groundY()){
    player.y = groundY() - PLAYER; player.vy = 0; player.onGround = true;
    player.airJumps = 1;               // refill double jump on landing
  }

  trail.push({x:player.x+PLAYER/2, y:player.y+PLAYER/2, life:1});
  for(const t of trail) t.life -= 0.045*dt;
  trail = trail.filter(t=>t.life>0);

  const pb = {x:player.x+5, y:player.y+5, w:PLAYER-10, h:PLAYER-10};
  for(const o of getObstacles()){
    const ox = o.x*U, ow = o.w*U, oh = o.h*U;
    const oy = groundY() - (o.y*U) - oh;
    if(ox > camX + W + U*2 || ox+ow < camX - U*2) continue;
    if(o.t === 'spike'){
      const sb = {x:ox+ow*0.3, y:oy+oh*0.42, w:ow*0.4, h:oh*0.58};
      if(rectsOverlap(pb, sb)){ die(); return; }
    } else {
      const bb = {x:ox, y:oy, w:ow, h:oh};
      if(rectsOverlap({x:player.x, y:player.y, w:PLAYER, h:PLAYER}, bb)){
        if(player.vy >= 0 && prevBottom <= oy + 14){
          player.y = oy - PLAYER; player.vy = 0; player.onGround = true;
          player.airJumps = 1;         // refill double jump on block landing too
        } else { die(); return; }
      }
    }
  }

  if(player.onGround && Math.random() < 0.5){
    particles.push({x:player.x, y:player.y+PLAYER, vx:-Math.random()*3-1, vy:-Math.random()*2, life:0.5, hue:bgHue+40, size:Math.random()*4+1});
  }

  const prog = Math.min(1, player.x / levelEndX());
  document.getElementById('progressBar').style.width = (prog*100).toFixed(1) + '%';
  const portalX = levelEndX();
  if(player.x + PLAYER > portalX && player.x < portalX + U*1.5){ completeLevel(); }
}

// ---------- DRAW ----------
function draw(){
  const g = groundY();
  const sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(sx, sy);

  const h1 = bgHue, h2 = (bgHue+60)%360;
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, 'hsl(' + h1 + ',65%,10%)');
  grad.addColorStop(0.6, 'hsl(' + h1 + ',70%,18%)');
  grad.addColorStop(1, 'hsl(' + h2 + ',80%,26%)');
  ctx.fillStyle = grad;
  ctx.fillRect(-20,-20,W+40,H+40);

  for(const s of stars){
    const tw = 0.5 + 0.5*Math.sin(tick*0.05 + s.p);
    ctx.globalAlpha = tw*0.8;
    ctx.fillStyle = 'hsl(' + h2 + ',100%,85%)';
    const spx = ((s.x*W - camX*0.08) % W + W) % W;
    ctx.fillRect(spx, s.y*H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'hsla(' + h1 + ',60%,24%,.5)';
  ctx.beginPath(); ctx.moveTo(0,g);
  for(let x=0; x<=W; x+=40){
    const wx = x + camX*0.25;
    ctx.lineTo(x, g - 60 - 90*Math.abs(Math.sin(wx*0.004)) - 40*Math.sin(wx*0.011));
  }
  ctx.lineTo(W,g); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'hsla(' + h2 + ',90%,65%,.25)';
  ctx.lineWidth = 1;
  const off = (-camX) % U;
  for(let x=off; x<W; x+=U){ ctx.beginPath(); ctx.moveTo(x,g); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=g; y<H; y+=U){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  ctx.strokeStyle = 'hsl(' + h2 + ',100%,70%)';
  ctx.lineWidth = 3; ctx.shadowColor = 'hsl(' + h2 + ',100%,60%)'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.moveTo(0,g); ctx.lineTo(W,g); ctx.stroke();
  ctx.shadowBlur = 0;

  const toScreen = x => x - camX;

  for(const o of getObstacles()){
    const ox = toScreen(o.x*U), ow = o.w*U, oh = o.h*U;
    const oy = g - o.y*U - oh;
    if(ox > W + U*2 || ox + ow < -U*2) continue;
    if(o.t === 'spike'){
      ctx.fillStyle = 'hsl(0,90%,55%)';
      ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(ox + ow*0.08, oy + oh);
      ctx.lineTo(ox + ow/2, oy + oh*0.05);
      ctx.lineTo(ox + ow*0.92, oy + oh);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'hsla(' + h2 + ',55%,22%,.95)';
      ctx.shadowColor = 'hsl(' + h2 + ',100%,60%)'; ctx.shadowBlur = 12;
      ctx.fillRect(ox, oy, ow, oh);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'hsl(' + h2 + ',100%,70%)'; ctx.lineWidth = 2;
      ctx.strokeRect(ox+1, oy+1, ow-2, oh-2);
      ctx.strokeStyle = 'hsla(' + h2 + ',100%,80%,.35)';
      for(let bx=0;bx<o.w;bx++) for(let by=0;by<o.h;by++)
        ctx.strokeRect(ox+bx*U+8, oy+by*U+8, U-16, U-16);
    }
  }

  const px = toScreen(levelEndX());
  if(px < W + 200){
    const pcx = px + U*0.75, pcy = g - U*1.6;
    const isLast = levelIdx === LEVELS.length-1;
    const ph = isLast ? 50 : (LEVELS[levelIdx+1].hue);
    for(let r=0; r<3; r++){
      ctx.save();
      ctx.translate(pcx, pcy);
      ctx.rotate(portalSpin*(r%2?1:-1) + r);
      ctx.strokeStyle = 'hsla(' + ph + ',100%,' + (65+r*8) + '%,' + (0.9-r*0.22) + ')';
      ctx.lineWidth = 5-r;
      ctx.shadowColor = 'hsl(' + ph + ',100%,60%)'; ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.ellipse(0, 0, U*(0.7+r*0.25), U*(1.5+r*0.3), 0, 0.3, Math.PI*2 - 0.1);
      ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    const pg = ctx.createRadialGradient(pcx,pcy,2,pcx,pcy,U*1.3);
    pg.addColorStop(0,'hsla(' + ph + ',100%,85%,.9)');
    pg.addColorStop(1,'hsla(' + ph + ',100%,50%,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(pcx,pcy,U*0.9,U*1.6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center';
    ctx.shadowColor='#fff'; ctx.shadowBlur=8;
    ctx.fillText(isLast ? '\u2726 FINISH \u2726' : 'PORTAL \u2192 LV ' + (levelIdx+2), pcx, pcy - U*2);
    ctx.shadowBlur=0;
  }

  // double jump shockwave rings
  for(const r of rings){
    ctx.globalAlpha = Math.max(0, r.life)*0.8;
    ctx.strokeStyle = 'hsl(' + ((bgHue+160)%360) + ',100%,70%)';
    ctx.lineWidth = 3*r.life;
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(toScreen(r.x), r.y, r.r*1.6, r.r*0.6, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  for(const t of trail){
    ctx.globalAlpha = t.life*0.5;
    ctx.fillStyle = 'hsl(' + ((bgHue+120)%360) + ',100%,65%)';
    const s = PLAYER*0.55*t.life;
    ctx.fillRect(toScreen(t.x)-s/2, t.y-s/2, s, s);
  }
  ctx.globalAlpha = 1;

  if(player && (state === 'play' || state === 'levelcomplete')){
    const pxs = toScreen(player.x);
    ctx.save();
    ctx.translate(pxs + PLAYER/2, player.y + PLAYER/2);
    ctx.rotate(player.rot);
    const scale = state==='levelcomplete' ? Math.max(0, 1 - warpTimer/40) : 1;
    ctx.scale(scale, scale);
    ctx.shadowColor = 'hsl(' + ((bgHue+120)%360) + ',100%,60%)'; ctx.shadowBlur = 20;
    const pgrad = ctx.createLinearGradient(-PLAYER/2,-PLAYER/2,PLAYER/2,PLAYER/2);
    pgrad.addColorStop(0,'hsl(' + ((bgHue+120)%360) + ',100%,60%)');
    pgrad.addColorStop(1,'hsl(' + ((bgHue+180)%360) + ',100%,55%)');
    ctx.fillStyle = pgrad;
    ctx.fillRect(-PLAYER/2, -PLAYER/2, PLAYER, PLAYER);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.strokeRect(-PLAYER/2, -PLAYER/2, PLAYER, PLAYER);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-PLAYER*0.22, -PLAYER*0.2, PLAYER*0.14, PLAYER*0.14);
    ctx.fillRect(PLAYER*0.08, -PLAYER*0.2, PLAYER*0.14, PLAYER*0.14);
    ctx.fillRect(-PLAYER*0.18, PLAYER*0.1, PLAYER*0.36, PLAYER*0.08);
    // double-jump indicator dot (visible while airborne and charge available)
    if(!player.onGround && player.airJumps > 0 && state === 'play'){
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, PLAYER*0.07, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  for(const p of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = 'hsl(' + p.hue + ',100%,65%)';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.fillRect(toScreen(p.x), p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if(flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + flash + ')';
    ctx.fillRect(-20,-20,W+40,H+40);
  }

  if(state === 'levelcomplete' && warpTimer > 15){
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 46px sans-serif';
    ctx.shadowColor = '#f0f'; ctx.shadowBlur = 25;
    ctx.fillText(levelIdx === LEVELS.length-1 ? 'ALL DIMENSIONS CLEARED!' : 'WARPING...', W/2, H/2);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ---------- LOOP ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(2.5, (now - last) / 16.67);
  last = now;
  syncSize();
  if(sized()){
    if(player && (!isFinite(player.y) || player.y > H*2)) resetPlayer();
    if(state !== 'menu' && state !== 'win') update(dt);
    else { tick += dt; portalSpin += 0.06*dt; bgHue += (bgHueTarget-bgHue)*0.03*dt; }
    try { draw(); } catch(e) {}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
